<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permainan Kartu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <h1>Permainan Kartu</h1>
        <div id="dealerHand"></div>
        <div id="playerHand"></div>
        <div id="result"></div>
        <button id="hitButton">Hit</button>
        <button id="standButton">Stand</button>
        <button id="newGameButton">Permainan Baru</button>
    </div>
    <div>
        <p>Saldo: <span id="balanceDisplay">1000</span></p>
        <input type="number" id="betInput" placeholder="Masukkan taruhan" />
        <button id="betButton">Taruh</button>
    </div>
      
    <script src="script.js"></script>
</body>
</html>
